<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Duck Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
        }

        header {
            text-align: center;
            padding: 15px;
            color: white;
            font-weight: 600;
            font-size: 20px;
        }
        

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }
        .center-image {
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            max-width: 350px; 
        }
             .card p {
            font-size: 24px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
        }

       
    </style>
</head>

<body>

<header>
    Ducks in a Row
</header>


<main>
    
    <!--47363-->
    <div class="card">  
        <img class="center-image" src="ducks.jpg"> <!--fourth duckling-->

        <p> 3 </p>
        
        <img class="center-image" src="ducks.jpg"> <!--second duckling-->

        <p> 3 </p>
        
        <img class="center-image" src="ducks.jpg"> <!--Mother duck-->

        <p> 4 </p>
        
        <img class="center-image" src="ducks.jpg"> <!--third duckling-->

        <p> 6 </p>
        
        <img class="center-image" src="ducks.jpg"> <!--first duckling-->

        <p> 7 </p>
        
    </div>
</main>




</body>
</html>
