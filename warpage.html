<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>War Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
        }

        header {
            text-align: center;
            padding: 15px;
            color: white;
            font-weight: 600;
            font-size: 20px;
        }
        

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;

        }

        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }
          .card p {
            font-size: 24px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
            text-align: left;
        }
    

       
    </style>
</head>

<body>

<header>
    War Dog Heroes
</header>


<main>
    
    
    <div class="card">  

        <p>
            FLARE &nbsp;&nbsp;&nbsp;&emsp;&emsp;&emsp; X_72
            <br>
            <br>
            RENNY &emsp&emsp;&emsp;&emsp; A54_
            <br>
            <br>
            MAJOR &nbsp;&emsp;&emsp; 91M_
            <br>
            <br>
            NEMO &nbsp;&nbsp;&emsp;&emsp;&emsp; A_34
        </p>
        
    </div>
</main>




</body>
</html>
